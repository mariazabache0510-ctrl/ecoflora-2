services:
  - type: web
    name: ecoflora
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO_EMAIL
        value: mariazabache0510@gmail.com
      - key: FACE_ENCRYPTION_KEY
        sync: false
      - key: FACE_MATCH_THRESHOLD
        value: "0.5"
