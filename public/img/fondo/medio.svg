<style>
  .arbol, .tallo { transform-box: fill-box; transform-origin: 50% 100%; animation: mecer var(--t, 7s) ease-in-out var(--d, 0s) infinite alternate; }
  .arbol { animation-name: mecer-suave; }
  @keyframes mecer { from { transform: rotate(-2.6deg); } to { transform: rotate(2.6deg); } }
  @keyframes mecer-suave { from { transform: rotate(-0.9deg); } to { transform: rotate(0.9deg); } }
  @media (prefers-reduced-motion: reduce) { .arbol, .tallo { animation: none; } }
</style>
